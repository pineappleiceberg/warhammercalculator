name: Deployment health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check public calculator deployment
        run: |
          set -o pipefail
          node web/scripts/check-deployment.mjs \
            https://amrishhallberg.com/warhammercalculator/ \
            --surface=static | tee deployment-health.json
      - name: Upload deployment health report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scheduled-deployment-health
          path: deployment-health.json
          if-no-files-found: warn
