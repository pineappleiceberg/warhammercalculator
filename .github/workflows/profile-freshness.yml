name: Profile data freshness

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare pinned profiles with upstream exports
        run: >-
          python3 scripts/profile_freshness.py
          --output build/profile-freshness-report.json
      - name: Upload machine-readable change report
        uses: actions/upload-artifact@v6
        with:
          name: profile-freshness-report
          path: build/profile-freshness-report.json
          if-no-files-found: error
      - name: Fail when a reviewed profile update is available
        run: >-
          python3 -c "import json,sys;
          report=json.load(open('build/profile-freshness-report.json'));
          sys.exit(report['status'] != 'current')"
