name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.x
          dune-cache: true
      - name: Install formal verification tools
        run: opam install frama-c.31.0 alt-ergo.2.6.2
      - name: Parse, prove, analyze, and instrument contracts
        run: opam exec -- bash scripts/run_formal.sh all

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure native build
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build native targets
        run: cmake --build build/native --parallel
      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.6
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WebAssembly core
        run: |
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/wasm --parallel
          cp build/wasm/calculator.js web/public/wasm/calculator.js
          cp build/wasm/calculator.wasm web/public/wasm/calculator.wasm
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Check web formatting
        working-directory: web
        run: npm run format:check
      - name: Lint web source
        working-directory: web
        run: npm run lint
      - name: Test worker and API build
        working-directory: web
        run: npm test
      - name: Test GitHub Pages build
        working-directory: web
        run: npm run test:pages
