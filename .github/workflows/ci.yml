name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.x
          dune-cache: true
      - name: Install formal verification tools
        run: opam install frama-c.31.0 alt-ergo.2.6.2
      - name: Parse, prove, analyze, and instrument contracts
        run: opam exec -- bash scripts/run_formal.sh all

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure native build
        run: >-
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DWHC_BUILD_BENCHMARKS=ON -DWHC_BENCHMARK_MAX_MS=250
      - name: Build native targets
        run: cmake --build build/native --parallel
      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure
      - name: Verify checked profile data and loadout provenance
        run: python3 -m unittest discover -s tests -p test_profiles_data.py
      - name: Verify profile source lock and generated artifacts
        run: python3 scripts/profile_freshness.py --offline
      - name: Verify source-locked battle rule catalogue
        run: python3 scripts/sync_battle_rule_catalogue.py --check
      - name: Record native large-volley benchmark
        run: build/native/warhammercalculator_benchmark 5 250 > build/native-benchmark.json
      - name: Upload native benchmark report
        uses: actions/upload-artifact@v6
        with:
          name: native-large-volley-benchmark
          path: build/native-benchmark.json
          if-no-files-found: error

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure sanitizer fuzz build
        env:
          CC: clang
        run: >-
          cmake -S . -B build/fuzz -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DWHC_BUILD_FUZZER=ON
      - name: Build sanitizer fuzz target
        run: cmake --build build/fuzz --target warhammercalculator_fuzz --parallel
      - name: Run bounded fuzz campaign
        run: ctest --test-dir build/fuzz -R warhammercalculator_fuzz_smoke --output-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.6
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WebAssembly core
        run: |
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DWHC_BUILD_BENCHMARKS=ON
          cmake --build build/wasm --parallel
          cp build/wasm/calculator.js web/public/wasm/calculator.js
          cp build/wasm/calculator.wasm web/public/wasm/calculator.wasm
      - name: Record WebAssembly large-volley benchmark
        run: node build/wasm/warhammercalculator_benchmark.js 3 500 > build/wasm-benchmark.json
      - name: Upload WebAssembly benchmark report
        uses: actions/upload-artifact@v6
        with:
          name: wasm-large-volley-benchmark
          path: build/wasm-benchmark.json
          if-no-files-found: error
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Check web formatting
        working-directory: web
        run: npm run format:check
      - name: Lint web source
        working-directory: web
        run: npm run lint
      - name: Test worker and API build
        working-directory: web
        run: npm test
      - name: Test GitHub Pages build
        working-directory: web
        run: npm run test:pages
