name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.6
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WebAssembly core
        run: |
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/wasm --parallel
          cp build/wasm/calculator.js web/public/wasm/calculator.js
          cp build/wasm/calculator.wasm web/public/wasm/calculator.wasm
      - name: Build static site
        working-directory: web
        env:
          GITHUB_PAGES_BASE: /warhammercalculator/
        run: |
          npm ci
          npm run test:pages
          touch dist-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
